<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plinkoo</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=money_bag" />
</head>
<body>
<div class="topBar">
  <div class="purseContainer">
    <p class="moneySign"><span class="material-symbols-outlined">money_bag</span></p>   
    <div id="purse"></div>
  </div>  
  
</div>
<div class="container">
  <div class="menu">
    <div class="playStyle">
      <div class="playOption active" id="manual">Manual</div>
      <div class="playOption unactive" id="automatic">Automatic</div>
    </div>
    <label for="betAmount" class="betAmountLabel">Bet Amount</label>
    <div class="betBox">
      <input type="text" id="betAmount" value="123">
      <button id="half" class="betButtons twoY" type="button">½</button>
      <button id="double" class="betButtons" type="button">2x</button>
    </div>
    <button id="placeBet" class="betActive" type="button">bet</button>
  </div>
  <div class="gameBox">
    <div id="resentWins"></div>
    <canvas id="plinkoCanvas"></canvas>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
